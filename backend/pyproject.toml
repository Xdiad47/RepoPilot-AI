[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv", ".workspaces", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",  # asserts are used in tests
  "S603", "S607",  # subprocess with fixed argv (no shell) is deliberate; see validation_service / repository_service
  "B008",
  "E501",  # long user-facing message strings are fine
  "S108",  # /tmp here is a path inside the sandbox container, not the host
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
